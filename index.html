<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSick</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  body{
    background-image: url(background.webp);
    background-position: center;
  }
</style>
<body style="background: rgb(241, 162, 175);">
    <header id="box">
        <img src="https://images.vexels.com/media/users/3/144097/isolated/preview/3dedcd235214cdde6b4e171fdbf66c9d-heart-icon.png" alt="Image not found"
           style="width: 40px;" height="40px">
        <h1 id="title">Lovesick</h1> 
        <button id="Settings">⚙️ Settings</button>
    </header>
    <main class="container">
        <!-- Section 1: Time Clocks -->
         <section class="cardsection textcenter">
           <h2>OUR CLOCKS</h2>
           <div class="clocksgrid">
             <div class="clock" id="myclock">
               <h3 id="mylabel">MY TIME</h3>
               <div class="timedisplay" id="mytime">00:00:00</div>
             </div>
             <div class="clock partner" id="partnerclock">
               <h3 id="partnerlabel">MY LOVE'S TIME</h3>
               <div class="timedisplay" id="partnertime">00:00:00</div>
             </div>
           </div>
         </section>
        <!-- Section 2: Countdown -->
         <section class="cardsection textcenter">
      <h2>REUNION COUNTDOWN</h2>
      <div class="countdowndisplay" id="countdowntext">Set a date in settings!</div>
      <p class="subtext" id="reunionsubtext"></p>
    </section>
    <!-- Section 3: Virtual Date Picker -->
    <section class="cardsection textcenter">
      <h2>VIRTUAL DATE DECIDER</h2>
      <div class="datebox">
        <p id="selectedactivity">Click below to pick an activity!</p>
      </div>
      <button id="spinbutton" class="primarybutton">💖 PICK A DATE NIGHT</button>
    </section>
    </main>
